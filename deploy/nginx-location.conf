# Template: install.py replaces @SERVER_NAME@ and includes this in that HTTPS server.
location = /freddie-sync {
    return 308 https://@SERVER_NAME@/freddie-sync/;
}

location ^~ /freddie-sync/ {
    if ($ssl_protocol !~ "^TLSv1\.[23]$") { return 426; }
    # The API issues no cookies or CORS headers; credentials only use Authorization.
    proxy_pass http://127.0.0.1:17483/;
    proxy_http_version 1.1;
    proxy_set_header Host @SERVER_NAME@;
    proxy_set_header Connection "";
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Cookie "";
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_connect_timeout 5s;
    proxy_send_timeout 600s;
    proxy_read_timeout 600s;
    client_body_timeout 120s;
    send_timeout 120s;
    client_max_body_size 512m;
    limit_req zone=freddie_sync_requests burst=30 nodelay;
    limit_req_status 429;
    limit_conn freddie_sync_connections 8;
    limit_conn_status 429;
    access_log off;
    error_log /var/log/nginx/freddie-sync-error.log warn;
    gzip off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
}
